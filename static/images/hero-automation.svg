<svg width="760" height="540" viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="760" height="540" rx="24" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Top Header Pill -->
  <rect x="28" y="24" width="704" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="52" cy="46" r="6" fill="#ef4444"/>
  <circle cx="72" cy="46" r="6" fill="#f59e0b"/>
  <circle cx="92" cy="46" r="6" fill="#10b981"/>
  <text x="380" y="51" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Musa Labs — Clarity • AI • Automation</text>
  <rect x="614" y="34" width="102" height="24" rx="12" fill="#dcfce7"/>
  <circle cx="630" cy="46" r="4" fill="#16a34a"/>
  <text x="671" y="50" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Live Flow</text>

  <!-- STAGE 1: CLARITY (FLOW ENGINEERING) -->
  <g filter="url(#cardShadow)">
    <rect x="28" y="88" width="704" height="116" rx="16" fill="#ffffff" stroke="#81cab7" stroke-width="2"/>
  </g>
  <rect x="52" y="108" width="144" height="26" rx="8" fill="#edf7f5"/>
  <text x="124" y="125" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#265a4c" text-anchor="middle">1. CLARITY FIRST</text>
  <text x="52" y="158" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Untangle the Process</text>
  <text x="52" y="180" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Strip out messy handoffs and bottlenecks.</text>

  <!-- Visual Chaos -> Clean Flow inside Stage 1 -->
  <rect x="380" y="106" width="140" height="80" rx="10" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="450" y="128" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#be123c" text-anchor="middle">MESSY MANUAL</text>
  <path d="M 402 155 Q 430 130, 455 168 T 498 145" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="3 3" fill="none"/>
  <path d="M 402 168 Q 445 178, 498 158" stroke="#fb7185" stroke-width="2" fill="none"/>

  <circle cx="545" cy="146" r="14" fill="#44a289"/>
  <text x="545" y="151" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">→</text>

  <rect x="570" y="106" width="140" height="80" rx="10" fill="#edf7f5" stroke="#81cab7"/>
  <text x="640" y="128" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#17362e" text-anchor="middle">CLEAN FLOW</text>
  <line x1="592" y1="156" x2="688" y2="156" stroke="#357e6b" stroke-width="3"/>
  <circle cx="600" cy="156" r="7" fill="#ffffff" stroke="#357e6b" stroke-width="2.5"/>
  <circle cx="640" cy="156" r="7" fill="#ffffff" stroke="#357e6b" stroke-width="2.5"/>
  <circle cx="680" cy="156" r="7" fill="#357e6b"/>

  <!-- Connector 1 -> 2 -->
  <path d="M 380 204 L 380 232" stroke="#44a289" stroke-width="3"/>
  <polygon points="374,230 380,240 386,230" fill="#44a289"/>

  <!-- STAGE 2: PRACTICAL AI (WITH HUMAN GUARDRAILS) -->
  <g filter="url(#cardShadow)">
    <rect x="28" y="240" width="704" height="116" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  </g>
  <rect x="52" y="260" width="144" height="26" rx="8" fill="#f3e8ff"/>
  <text x="124" y="277" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#6d28d9" text-anchor="middle">2. PRACTICAL AI</text>
  <text x="52" y="310" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">AI Reads, Drafts &amp; Preps</text>
  <text x="52" y="332" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Handles 90% of the work; you approve in 1 click.</text>

  <!-- Visual AI + 1-Click Approval inside Stage 2 -->
  <rect x="380" y="260" width="185" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="396" y="284" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#6d28d9">✨ AI Assistant</text>
  <text x="396" y="304" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">✓ PDF &amp; Lead Analyzed</text>
  <text x="396" y="322" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e293b">✓ Reply &amp; Quote Ready</text>

  <rect x="580" y="260" width="130" height="76" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="645" y="283" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="800" fill="#15803d" text-anchor="middle">SLACK / EMAIL</text>
  <rect x="597" y="294" width="96" height="30" rx="8" fill="#16a34a"/>
  <text x="645" y="314" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✓ Approve</text>

  <!-- Connector 2 -> 3 -->
  <path d="M 380 356 L 380 384" stroke="#7c3aed" stroke-width="3"/>
  <polygon points="374,382 380,392 386,382" fill="#7c3aed"/>

  <!-- STAGE 3: AUTOMATION (AUTOPILOT SYNC) -->
  <g filter="url(#cardShadow)">
    <rect x="28" y="392" width="704" height="120" rx="16" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  </g>
  <rect x="52" y="412" width="144" height="26" rx="8" fill="#e0f2fe"/>
  <text x="124" y="429" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#0369a1" text-anchor="middle">3. AUTOMATION</text>
  <text x="52" y="462" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Tools Sync on Autopilot</text>
  <text x="52" y="484" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Runs 24/7 on Cloudflare with zero dropped tasks.</text>

  <!-- 3 Synced Badges inside Stage 3 -->
  <rect x="380" y="416" width="102" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="431" cy="440" r="11" fill="#dcfce7"/>
  <text x="431" y="444" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">✓</text>
  <text x="431" y="472" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">CRM Sync</text>

  <rect x="494" y="416" width="102" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="545" cy="440" r="11" fill="#dcfce7"/>
  <text x="545" y="444" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">✓</text>
  <text x="545" y="472" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Accounting</text>

  <rect x="608" y="416" width="102" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="659" cy="440" r="11" fill="#dcfce7"/>
  <text x="659" y="444" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">✓</text>
  <text x="659" y="472" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Follow-Ups</text>
</svg>
