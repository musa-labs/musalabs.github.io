baseURL = "https://musalabs.io/"
languageCode = "en-us"
title = "Musa Labs"

# Theme Config
theme = "../.."

# Enable syntax highlighting
pygmentsCodeFences = true
pygmentsUseClasses = true

# Enable emoji support
enableEmoji = true

# Enable Git info for lastmod
enableGitInfo = true

# Enable taxonomies
[taxonomies]
  category = 'categories'
  tag = 'tags'

[pagination]
  pagerSize = 6
  path = "page"

[params]
  description = "Flow Engineering & AI Automation: We bring clarity and flow to your business processes before putting your busywork on autopilot."
  author = "Luke Milby"
  logo = "/images/logo.png"
  
  # Global CTA Configuration
  [params.cta]
    enable = true
    title = "Ready to bring clarity and flow to your operations?"
    description = "Book a free 30-minute Flow Session. We'll map out your biggest bottleneck and show you what to simplify and what to automate."
    gradient_from = "#50B69B"
    gradient_to = "#2B589F"
    gradient_angle = 30
    [params.cta.secondary_button]
      text = "Book a Free Discovery Call"
      url = "https://cal.com/musa-labs/discovery"
  
  # Social Media Links
  [params.social]
    github = "https://github.com/Musa-Labs"
    linkedin = "https://www.linkedin.com/in/luke-milby/"
  
  # Footer Configuration
  [params.footer]
    column_1_title = "Solutions"
    column_2_title = "Company"
    column_3_title = "Legal"
  
  [params.header]
    background = "bg-white/80 backdrop-blur-sm"
    border = "border-b border-gray-100"
    
    [params.header.logo]
      src = "/images/logo.png"
    
    [params.header.menu]
      spacing = "space-x-8"
      
      [params.header.menu.dropdown]
        width = "w-72"
        container_padding = "py-6"
        item_padding = "px-8 py-3"
        background = "bg-white"
        border = "border border-gray-100"
        shadow = "shadow-xl"
        radius = "rounded-lg"
        text_color = "text-gray-700"
        hover_background = "hover:bg-gray-50"
        text_size = "text-sm"
    
    [params.header.buttons]
      [params.header.buttons.getStarted]
        text = "Book a Call"
        url = "https://cal.com/musa-labs/discovery"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.80.0"

[build]
  writeStats = true

[build.buildStats]
  enable = true

[security.funcs]
  getenv = ['^HUGO_', '^CI$']

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = true
    codeFences = true
    guessSyntax = true
    lineNumbersInTable = true
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

# Navigation Menu
[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 0
  [[menu.main]]
    name = "Solutions"
    weight = 1
    [menu.main.params]
      has_submenu = true
      submenu = [
        { name = "AI Assistants & Workflows", url = "/services/ai-agents-workflows/" },
        { name = "Automated Data & App Sync", url = "/services/data-pipelines/" },
        { name = "Company Knowledge AI", url = "/services/edge-rag/" }
      ]
  [[menu.main]]
    name = "How It Works"
    url = "/how-it-works/"
    weight = 2
  [[menu.main]]
    name = "About"
    url = "/company/"
    weight = 3

  # Footer Column 1 Menu
  [[menu.footer_column_1]]
    name = "AI Assistants & Workflows"
    url = "/services/ai-agents-workflows/"
    weight = 1
  [[menu.footer_column_1]]
    name = "Automated Data & App Sync"
    url = "/services/data-pipelines/"
    weight = 2
  [[menu.footer_column_1]]
    name = "Company Knowledge AI"
    url = "/services/edge-rag/"
    weight = 3

  # Footer Column 2 Menu
  [[menu.footer_column_2]]
    name = "How It Works"
    url = "/how-it-works/"
    weight = 1
  [[menu.footer_column_2]]
    name = "About Us"
    url = "/company/"
    weight = 2

  # Footer Column 3 Menu
  [[menu.footer_column_3]]
    name = "Privacy Policy"
    url = "/privacy/"
    weight = 1
  [[menu.footer_column_3]]
    name = "Terms & Licensing"
    url = "/license/"
    weight = 2
